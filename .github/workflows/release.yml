name: Release

# Push a tag like v1.1.0 to build the Mergio installers for Windows, macOS and Linux and publish a GitHub release.
# Windows and Linux are published as soon as they're built. GitHub is sometimes short of Mac machines, so the
# macOS disk image is built afterwards by mac.yml (which retries by itself) and added to the same release.
# Run it by hand (workflow_dispatch) to get all the installers as workflow artifacts without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the jobs that publish get write access.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A release builds macOS separately (see the mac job); a run by hand builds all three here.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["windows-latest", "ubuntu-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Inno Setup download is not signed' }
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS','/DIR=C:\InnoSetup' -Wait
          "ISCC=C:\InnoSetup\ISCC.exe" >> $env:GITHUB_ENV

      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: dist/release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # Third-party action pinned to a commit, so a moved tag can't change what runs with write access (v2).
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: assets/*
          generate_release_notes: true
      - name: Say that the macOS download is on its way
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          if ! grep -q 'mac-pending' body.md; then
            { echo '> **macOS:** the Mac download is still being built and will be added to this release soon. <!-- mac-pending -->'; echo; cat body.md; } > notes.md
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          fi

  mac:
    needs: release
    permissions:
      contents: write
      actions: write # lets the macOS build start itself again when no Mac machine was free
    uses: ./.github/workflows/mac.yml
    with:
      tag: ${{ github.ref_name }}
